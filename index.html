<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontext Atlas</title>

  <!-- Karte: Google 3D Maps oder Cesium als Ersatz, wird in src/main.js geladen -->

  <!-- three.js (Innenraum, Polycam-Modelle) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css?v=1794436864">
</head>
<body>
  <main id="panes">
    <div id="divider" aria-hidden="true"></div>
  </main>

  <nav id="switch" aria-label="Places">
    <button type="button" data-view="bremen">Bremen</button>
    <button type="button" data-view="berlin">Berlin</button>
    <button type="button" data-view="split">Compare</button>
    <button type="button" data-toggle="notes" class="gap">Notes</button>
  </nav>

  <nav id="levels" aria-label="Zoom levels"></nav>

  <p id="hint" class="outlined">Scroll to zoom, drag to look around,<br>arrow keys to move</p>
  <p id="status" class="outlined" hidden></p>

  <script type="module" src="src/main.js?v=1794436864"></script>
</body>
</html>
