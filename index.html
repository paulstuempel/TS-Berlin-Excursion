<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontext Atlas</title>

  <!-- Karte: Google 3D Maps oder Cesium als Ersatz, wird in src/main.js geladen -->

  <!-- three.js (Innenraum, Polycam-Modelle) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <div id="earth"></div>
    <div id="interior" hidden></div>
    <div id="veil"></div>
  </main>

  <header id="place">
    <p class="place-city" data-bind="name"></p>
    <p class="place-address" data-bind="address"></p>
  </header>

  <nav id="levels" aria-label="Zoomstufen"></nav>

  <p id="hint">Scrollen zum Zoomen, Ziehen zum Umsehen, Pfeiltasten zum Bewegen</p>
  <p id="status" hidden></p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
