<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontext Atlas</title>

  <!-- Karte: Google 3D Maps oder Cesium als Ersatz, wird in src/main.js geladen -->

  <!-- three.js (Innenraum, Polycam-Modelle) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css?v=1795260715">
</head>
<body>
  <main id="panes">
  </main>

  <nav id="switch" aria-label="Places">
    <button type="button" data-view="bremen">Data Atlas</button>
    <button type="button" data-view="berlin">Pickle Bar</button>
    <button type="button" data-toggle="notes" class="gap" data-i18n="notes">Notes</button>
  </nav>

  <nav id="levels" aria-label="Zoom levels"></nav>

  <nav id="meta">
    <button type="button" data-about>About</button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </nav>

  <section id="about" hidden aria-modal="true" role="dialog" aria-labelledby="about-title">
    <button type="button" class="about-close" aria-label="Close"></button>
    <article class="about-inner">
      <h1 id="about-title"></h1>
      <div class="about-body"></div>
    </article>
  </section>

  <p id="hint" class="outlined" data-i18n-html="hint"></p>
  <p id="status" class="outlined" hidden></p>

  <script type="module" src="src/main.js?v=1795260715"></script>
</body>
</html>
